name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a rolling release PR. Merging it bumps version.txt and
      # metadata.json, writes the CHANGELOG, tags, and creates the GitHub release.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the tagged commit
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Package the extension
        if: ${{ steps.release.outputs.release_created }}
        run: |
          # FreshRSS installs an extension by dropping the whole directory into
          # extensions/, so the zip has to contain that directory, not its bare
          # contents. Development-only files are left out.
          mkdir -p dist/xExtension-RssCloud
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.githooks' \
            --exclude='dist' \
            --exclude='phpstan.neon' \
            --exclude='release-please-config.json' \
            --exclude='.release-please-manifest.json' \
            --exclude='.markdownlint-cli2.jsonc' \
            ./ dist/xExtension-RssCloud/
          cd dist && zip -qr ../xExtension-RssCloud.zip xExtension-RssCloud

      - name: Attach the zip to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" xExtension-RssCloud.zip
